<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- 복셀 큐브 아이콘 -->
  <g transform="translate(10, 12)">
    <!-- 큐브 상단면 -->
    <path d="M28 8 L48 20 L28 32 L8 20 Z" fill="#1E6091" />
    <!-- 큐브 좌측면 -->
    <path d="M8 20 L28 32 L28 52 L8 40 Z" fill="#1A4F7A" />
    <!-- 큐브 우측면 -->
    <path d="M28 32 L48 20 L48 40 L28 52 Z" fill="#2D7DD2" />
    <!-- 작은 큐브 1 (우측 하단) -->
    <path d="M42 38 L52 44 L42 50 L32 44 Z" fill="#1E6091" opacity="0.8"/>
    <path d="M32 44 L42 50 L42 58 L32 52 Z" fill="#1A4F7A" opacity="0.8"/>
    <path d="M42 50 L52 44 L52 52 L42 58 Z" fill="#2D7DD2" opacity="0.8"/>
    <!-- 작은 큐브 2 (좌측 하단) -->
    <path d="M4 38 L14 44 L4 50 L-6 44 Z" fill="#1E6091" opacity="0.7"/>
    <path d="M-6 44 L4 50 L4 58 L-6 52 Z" fill="#1A4F7A" opacity="0.7"/>
    <path d="M4 50 L14 44 L14 52 L4 58 Z" fill="#2D7DD2" opacity="0.7"/>
    <!-- 회로 패턴 선들 -->
    <line x1="28" y1="8" x2="28" y2="0" stroke="#2D7DD2" stroke-width="1.5"/>
    <line x1="28" y1="0" x2="40" y2="-6" stroke="#2D7DD2" stroke-width="1.5"/>
    <circle cx="40" cy="-6" r="2.5" fill="#2D7DD2"/>
    <line x1="48" y1="20" x2="56" y2="16" stroke="#2D7DD2" stroke-width="1.5"/>
    <circle cx="56" cy="16" r="2" fill="#2D7DD2"/>
    <line x1="8" y1="20" x2="0" y2="14" stroke="#2D7DD2" stroke-width="1.5"/>
    <circle cx="0" cy="14" r="2" fill="#C8A951"/>
    <line x1="48" y1="20" x2="56" y2="26" stroke="#1E6091" stroke-width="1"/>
    <circle cx="56" cy="26" r="1.5" fill="#C8A951"/>
    <!-- 추가 회로 노드 -->
    <line x1="28" y1="0" x2="18" y2="-4" stroke="#1E6091" stroke-width="1"/>
    <circle cx="18" cy="-4" r="1.5" fill="#2D7DD2"/>
  </g>
  <!-- HanVoxel 텍스트 -->
  <text x="78" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" fill="#1B7340" letter-spacing="-0.5">
    HanVoxel
  </text>
  <!-- 스우시 곡선 -->
  <path d="M78 58 Q160 62 260 50 Q280 48 290 50" stroke="url(#swooshGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <defs>
    <linearGradient id="swooshGrad" x1="78" y1="56" x2="290" y2="56">
      <stop offset="0%" stop-color="#1B7340" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#1B7340" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F4D2A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
